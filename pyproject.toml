[project]
name = "chat-agent"
version = "0.1.0"
description = "Chat assistant agent as a Mistral Workflow"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
